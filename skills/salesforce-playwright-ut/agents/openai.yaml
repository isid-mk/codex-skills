interface:
  display_name: "Salesforce数式・入力規則・ボタン表示テスト"
  short_description: "数式・入力規則・ボタン表示条件を対象選別し、プロファイル別の実測と証跡を出力する"
  default_prompt: "$salesforce-playwright-ut を使い、現在の仕様書・設計書を読み直し、test-scope.mdとselect_test_scope.pyで数式項目のロジックチェック・入力規則・ボタン表示条件の対象IDを確定してから、権限設計書も参照し、ボタン表示条件はケース内の全対象プロファイルに代理ログインして表示／非表示が分かる画面を個別取得する手順を確認・実装し、Playwrightで順次実行してください。エビデンスは仕様書ごとに1冊、ケースNoごとに1シート、同じ番号の枝番は同じシートに記載してください。Salesforce設定とUserレコードは変更せず、資料不足は都度確認せず根拠付きの想定で補い、実施したテストは前提付きOK／NGとして、想定・入力・期待値・実結果・検証方法・未検証範囲を記録してください。対象IDに必要な未対応処理だけを追加実装し、レイアウト・権限・項目定義・画面配置・ボタン押下後の業務処理等の独立テストを追加せず、対象外を結果集計へ含めないでください。未実行や通信障害を製品の判定に置換しないでください。"
